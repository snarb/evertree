name: CI

on:
  push:
  pull_request:

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        workers: [0, auto]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run python -m evertree.core.programs.layout
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - name: Fast tests
        run: uv run pytest -q -n ${{ matrix.workers }} --durations=15
      - name: Portable integration
        run: uv run pytest tests/integration -q -n ${{ matrix.workers }} --durations=15
      - run: uv build --wheel

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - name: Native filesystem isolation and process ownership
        run: uv run pytest tests/native -q -n 0 --durations=15
      - name: Outgoing HTTPS smoke
        env:
          EVERTREE_NETWORK_SMOKE: '1'
        run: uv run pytest tests/native/test_network.py -q -n 0
