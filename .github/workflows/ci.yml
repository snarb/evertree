name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - name: Check Self/Process taxonomy and source layout
        run: uv run python -m evertree.core.programs.layout
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv build --wheel
