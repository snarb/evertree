[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evertree"
version = "0.1.0"
description = "EverTree agent architecture implementation"
readme = "README.md"
requires-python = ">=3.13.16,<3.14"
dependencies = [
    "dbos>=3.2,<4",
    "msgpack>=1.2,<2",
    "openai-codex==0.160.0",
    "packaging>=26,<27",
    "pydantic>=2.12,<3",
    "websockets>=17,<18",
    "zstandard>=0.25,<1",
]

[project.scripts]
evertree = "evertree.cli:main"

[dependency-groups]
dev = ["ruff>=0.15", "pytest>=8", "pytest-asyncio>=1", "pytest-xdist>=3.8,<4"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/component"]
addopts = "-n auto --dist=load --import-mode=importlib"
asyncio_mode = "auto"
tmp_path_retention_count = 2
tmp_path_retention_policy = "failed"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]
include = ["evertree*"]
namespaces = false
