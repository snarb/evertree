[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evertree"
version = "0.1.0"
description = "EverTree agent architecture implementation"
readme = "README.md"
requires-python = ">=3.13.16,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["evertree*"]
namespaces = false
